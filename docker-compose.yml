services:
  api:
    build: .
    image: invoice-allocation-api:latest
    container_name: invoice-allocation-api
    ports:
      - "8000:8000"
    environment:
      INVOICE_DB_PATH: /data/invoices.db
    volumes:
      - invoice-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  invoice-data:
